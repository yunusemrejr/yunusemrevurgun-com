<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Fonts are the same self-hosted variable files the site serves. */
  @font-face {
    font-family: 'Fredoka';
    src: url('FONT_DIR_PLACEHOLDER/fredoka-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-display: block;
  }
  @font-face {
    font-family: 'Atkinson Hyperlegible Next';
    src: url('FONT_DIR_PLACEHOLDER/atkinson-next-latin.woff2') format('woff2');
    font-weight: 200 800;
    font-display: block;
  }

  html, body { margin: 0; padding: 0; background: #69b0f9; }

  /* Open Graph / Twitter share card: 1200x630 (1.91:1).
     The brand blue field, the mascot on the navy lobed band, the name in
     Fredoka. Title, subtitle and label are filled in by build-og-image.sh. */
  #card {
    position: relative;
    width: 1200px; height: 630px;
    box-sizing: border-box;
    background: #69b0f9;
    overflow: hidden;
    font-family: 'Atkinson Hyperlegible Next', sans-serif;
    color: #1b2140;
  }

  /* navy band with lobes rising into the blue, like the site footer */
  #band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
    background: #1b2140;
  }
  #lobes {
    position: absolute; left: 0; right: 0; bottom: 92px; height: 30px;
    background: radial-gradient(circle at 50% 100%, #1b2140 0 29.5px, transparent 30px) 0 0 / 60px 30px repeat-x;
  }
  #url {
    position: absolute; left: 76px; bottom: 30px;
    font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 0.01em;
    color: #fbf8f4;
  }

  #text { position: absolute; left: 76px; top: 86px; width: 640px; }
  #label {
    display: inline-block;
    font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 28px;
    color: #fbf8f4; background: #262e4d;
    padding: 6px 24px 8px; border-radius: 999px; margin-bottom: 28px;
  }
  #title {
    margin: 0 0 22px;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: TITLE_SIZE_PLACEHOLDERpx; line-height: 1.02; letter-spacing: -0.02em;
    color: #1b2140;
  }
  #sub { margin: 0; font-size: 34px; line-height: 1.32; color: #1b2140; max-width: 600px; }

  #mascot {
    position: absolute; right: 52px; bottom: 44px;
    width: 470px; height: 470px;
    filter: drop-shadow(0 26px 22px rgba(20, 26, 51, 0.38));
  }
</style>
</head>
<body>
  <div id="card">
    <div id="text">
      <span id="label">LABEL_PLACEHOLDER</span>
      <h1 id="title">TITLE_PLACEHOLDER</h1>
      <p id="sub">SUB_PLACEHOLDER</p>
    </div>
    <div id="lobes"></div>
    <div id="band"></div>
    <div id="url">yunusemrevurgun.com</div>
    <img id="mascot" src="MASCOT_PATH_PLACEHOLDER" alt="">
  </div>
</body>
</html>
