<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Fonts are the same self-hosted variable files the site serves. */
  @font-face {
    font-family: 'Fraunces';
    src: url('FONT_DIR_PLACEHOLDER/fraunces-latin.woff2') format('woff2');
    font-weight: 400 800;
    font-display: block;
  }
  @font-face {
    font-family: 'Inter';
    src: url('FONT_DIR_PLACEHOLDER/inter-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-display: block;
  }

  html, body { margin: 0; padding: 0; background: #15120f; }

  /* Open Graph / Twitter share card: 1200x630 (1.91:1).
     Composes the landing photograph with the site wordmark on the v4 palette,
     so a shared link looks like the site it points to. */
  #card {
    position: relative;
    width: 1200px; height: 630px;
    box-sizing: border-box;
    background-color: #15120f;
    background-image: radial-gradient(80% 120% at 82% 26%, rgba(224, 163, 63, 0.16) 0%, rgba(224, 163, 63, 0.04) 45%, transparent 70%);
    display: flex; align-items: center; gap: 68px;
    padding: 0 76px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #ece2d0;
  }

  #photo {
    position: relative;
    flex: 0 0 auto;
    width: 400px; height: 400px;
    overflow: hidden;
    border: 1px solid rgba(224, 163, 63, 0.38);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 70px rgba(224, 163, 63, 0.08);
  }
  #photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #photo::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 100% at 50% 6%, rgba(224, 163, 63, 0.12) 0%, transparent 58%),
      linear-gradient(180deg, transparent 62%, rgba(9, 7, 5, 0.42) 100%);
  }

  #meta { display: flex; flex-direction: column; gap: 18px; }
  #name {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 92px;
    line-height: 1;
    letter-spacing: 0.12em;
    text-indent: 0.12em;
    margin: 0;
  }
  #tagline {
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #e0a33f;
    margin: 0;
  }
  #rule { width: 120px; height: 1px; background: rgba(236, 226, 208, 0.26); }
  #host { font-size: 20px; color: #bda98a; margin: 0; }
</style>
</head>
<body>
  <div id="card">
    <div id="photo"><img src="PHOTO_PATH_PLACEHOLDER" alt=""></div>
    <div id="meta">
      <h1 id="name">Yemre</h1>
      <p id="tagline">The world of a developer</p>
      <div id="rule"></div>
      <p id="host">yunusemrevurgun.com</p>
    </div>
  </div>
</body>
</html>
