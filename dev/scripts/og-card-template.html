<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #e3e2de; }
  /* Open Graph / Twitter share card: 1200x630 (1.91:1). The home hero SVG is
     16:9 on the same cream background, so object-fit:contain shows the whole
     hero with seamless cream side margins. */
  #card {
    width: 1200px; height: 630px;
    background: #e3e2de;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #card img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
  <div id="card">
    <img src="SVG_PATH_PLACEHOLDER" alt="">
  </div>
</body>
</html>
