; =============================================================================
; PHP Configuration for Shared Hosting (LiteSpeed LSAPI)
; Place in document root alongside .htaccess
; Changes may take up to 5 minutes to take effect due to LSAPI caching
; =============================================================================

; NEVER display errors to visitors (prevents path disclosure)
display_errors = Off
log_errors = On

; Disable dangerous features
allow_url_fopen = Off
allow_url_include = Off
expose_php = Off

; Session hardening for custom auth systems
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
; App-level admin idle timeout (60 min) must govern expiry, not PHP's
; default 24-min garbage collector — GC deleted mobile sessions mid-flow.
session.gc_maxlifetime = 86400

; Upload limits (enforced server-side in addition to PHP validation)
; App caps: gallery/travel batches up to 12 files x 5MB, music up to 50MB.
; If the host caps these lower, the app detects oversized posts and shows a clear error.
upload_max_filesize = 52M
post_max_size = 65M
max_file_uploads = 20

; Memory and execution safety
memory_limit = 128M
max_execution_time = 30
