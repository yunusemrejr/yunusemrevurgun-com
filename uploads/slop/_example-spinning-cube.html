<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test 3D Example</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: #15120f;
    color: #f5efe4;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .scene { width: 160px; height: 160px; perspective: 600px; }
  .cube {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 6s linear infinite;
  }
  .cube div {
    position: absolute;
    width: 160px; height: 160px;
    border: 2px solid #e0a33f;
    background: rgba(224, 163, 63, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: #e0a33f;
  }
  .front  { transform: translateZ(80px); }
  .back   { transform: rotateY(180deg) translateZ(80px); }
  .right  { transform: rotateY(90deg) translateZ(80px); }
  .left   { transform: rotateY(-90deg) translateZ(80px); }
  .top    { transform: rotateX(90deg) translateZ(80px); }
  .bottom { transform: rotateX(-90deg) translateZ(80px); }
  @keyframes spin {
    from { transform: rotateX(-20deg) rotateY(0deg); }
    to   { transform: rotateX(-20deg) rotateY(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cube { animation: none; transform: rotateX(-20deg) rotateY(30deg); }
  }
  p { opacity: 0.7; font-size: 14px; text-align: center; max-width: 420px; }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="cube">
      <div class="front">1</div>
      <div class="back">2</div>
      <div class="right">3</div>
      <div class="left">4</div>
      <div class="top">5</div>
      <div class="bottom">6</div>
    </div>
  </div>
  <p>Test entry for the Quality 3D AI Slop section. The site injects SEO tags and a small Home button into this file when it is served. Safe to delete from the admin panel.</p>
</body>
</html>
