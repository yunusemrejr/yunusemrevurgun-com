<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Crossfade Test</title>
    <style>
        body {
            background: #1f2228;
            color: #fff;
            font-family: sans-serif;
            padding: 2rem;
        }
        .frame {
            position: relative;
            width: 320px;
            aspect-ratio: 4 / 5;
            border-radius: 8px;
            overflow: hidden;
            background: #252830;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .frame img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1.5s ease;
        }
        .active { opacity: 1; z-index: 1; }
        .inactive { opacity: 0; z-index: 0; }
        #status {
            margin-top: 1rem;
            font-family: monospace;
            color: #0f0;
        }
    </style>
</head>
<body>
    <h1>Profile Crossfade Test</h1>
    <p>If working, you should see the image switch every 3 seconds.</p>
    <div class="frame">
        <img id="landing-pfp-1" class="active" src="assets/images/landing_pfp.jpg" alt="Photo">
        <img id="landing-pfp-2" class="inactive" src="assets/images/landing_pfp2.jpg" alt="Cartoon">
    </div>
    <div id="status">Waiting for images to load...</div>

    <script>
        var img1 = document.getElementById('landing-pfp-1');
        var img2 = document.getElementById('landing-pfp-2');
        var status = document.getElementById('status');
        var isActive = true;
        var count = 0;

        function whenLoaded(img, cb) {
            if (img.complete && img.naturalWidth > 0) {
                cb();
            } else {
                img.addEventListener('load', cb, { once: true });
                img.addEventListener('error', function() {
                    status.innerHTML += '<br>ERROR loading: ' + img.src;
                    cb();
                }, { once: true });
            }
        }

        whenLoaded(img1, function() {
            status.innerHTML = 'Image 1 loaded.<br>';
            whenLoaded(img2, function() {
                status.innerHTML += 'Image 2 loaded. Starting crossfade...';
                setInterval(function() {
                    count++;
                    if (isActive) {
                        img1.classList.remove('active');
                        img1.classList.add('inactive');
                        img2.classList.remove('inactive');
                        img2.classList.add('active');
                        status.innerHTML = 'Switch #' + count + ': Showing CARTOON (landing_pfp2.jpg)';
                    } else {
                        img2.classList.remove('active');
                        img2.classList.add('inactive');
                        img1.classList.remove('inactive');
                        img1.classList.add('active');
                        status.innerHTML = 'Switch #' + count + ': Showing PHOTO (landing_pfp.jpg)';
                    }
                    isActive = !isActive;
                }, 3000);
            });
        });
    </script>
</body>
</html>
